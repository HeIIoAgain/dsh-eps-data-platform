name: Bug report
description: 报一个可复现的问题（取数失败、导出不对、登录报错等）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜一下现有 Issue。**不要粘贴 `sid`、手机号、短信验证码**（用 `138xxxx` 代替）。
        平台报错原文（如「操作过于频繁，请稍候。」）很有用，可以保留。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 期望结果 vs 实际结果
      placeholder: 我运行 query 导出 GDP，期望 CSV 有 3 行，实际只有表头
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现命令（脱敏）
      render: bash
      placeholder: |
        eps-client query --cube 891 --dims '{"time":["2024010101"],"indicator":["01010103"]}' --out gdp.csv
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: 输出 / 报错（脱敏）
      render: text
      placeholder: |
        [i] cube=891 sheetId=**** 布局: 行=time 列=indicator 固定=
        接口错误: 操作过于频繁，请稍候。
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: 仓库版本（Release tag）或 git commit
      placeholder: v1.0.0 或 1a2b3c4
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: 操作系统 + Python 版本
      placeholder: Windows 11 / Python 3.12.4
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 怎么用的
      options:
        - DSH 技能（Agent 调用）
        - 命令行 eps_client.py / eps-client
        - 自己写代码 import
    validations:
      required: true
