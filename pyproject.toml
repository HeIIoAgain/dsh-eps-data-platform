[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eps-data-platform"
version = "1.0.0"
description = "CLI + DeepSeek Harness skill for pulling China statistics from EPS 数据平台 (olap.epsnet.com.cn)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HeIIoAgain" }]
keywords = ["eps", "epsnet", "statistics", "china-data", "deepseek-harness", "dsh", "cli"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "requests>=2.28",
  "cryptography>=41",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
dev = [
  "openpyxl>=3.1",
  "pytest>=8",
  "ruff>=0.6",
  "tomli>=2; python_version < '3.11'",
]

[project.scripts]
eps-client = "eps_client:main"

[project.urls]
Homepage = "https://github.com/HeIIoAgain/dsh-eps-data-platform"
Repository = "https://github.com/HeIIoAgain/dsh-eps-data-platform"
Issues = "https://github.com/HeIIoAgain/dsh-eps-data-platform/issues"
Changelog = "https://github.com/HeIIoAgain/dsh-eps-data-platform/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = ["eps_client"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
